<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Promotion Cadre & MR – Summary</title>
  <style>
    :root{
      --green:#a8e6cf;
      --green-dark:#81c784;
      --yellow:#fff9c4;
      --navy:#80cbc4;
      --dark:#6d6875;
      --row-accent:#fcefe9;
      --row-accent-2:#f9fbe7;
      --white:#fff;
    }
    *{box-sizing:border-box}
    body{
      margin:0; 
      font-family:system-ui,-apple-system,Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, "Noto Sans", sans-serif; 
      background:#87f87696; 
      color:#111;
    }
    .wrap{max-width:1100px; margin:32px auto 140px; padding:0 20px}

    /* Top banner */
    .banner{
      background:var(--green);
      color:#444;
      text-align:center;
      padding:22px 16px;
      border-radius:18px;
      font-weight:800;
      letter-spacing:.5px;
      font-size: 40px;
      text-transform:uppercase;
      box-shadow:0 6px 18px rgba(0,0,0,.08);
      position:relative;
    }
    .banner small{
      position:absolute; left:18px; bottom:1px; 
      color:#333; background:rgba(255,255,255,.5);
      padding:3px 12px; border-radius:10px; 
      font-weight:700; letter-spacing:.4px; font-size:.85rem;
      white-space:nowrap; border:2px solid rgba(0,0,0,.05);
    }

    /* Section titles */
    .section-title{
      margin:42px 0 8px; 
      background:var(--dark); 
      color:var(--yellow);
      padding:10px 14px; 
      border-radius:10px; 
      font-weight:800; 
      text-align:center; 
      text-transform:uppercase; 
      text-decoration:underline; 
      text-underline-offset:4px;
      font-size: large;
    }

    /* Table styling */
    .card{background:#fff; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,.05); overflow:hidden}
    table{width:100%; border-collapse:separate; border-spacing:0; color: #111;}
    thead th{
      background:var(--navy); 
      color:#080404; 
      padding:14px 12px; 
      text-transform:uppercase; 
      font-weight:800; 
      font-size:1.2rem; 
      border-right:2px solid rgba(0,0,0,.1)
    }
    thead th:last-child{border-right:none}
    thead th.group{text-align:center}
    tbody td{
      padding:13px 12px; 
      border-top:1px solid #ccc; 
      font-weight:600;
      background:transparent;
    }
    tbody tr:nth-child(odd){background:var(--row-accent-2)}
    tbody tr:nth-child(even){background:#fff}
    tbody tr.highlight{background:var(--row-accent)}
    tbody td+td{border-left:1px solid #ccc}

    /* Editable highlight */
    td[contenteditable="true"]{
      cursor:text;
      outline:none;
      transition:background .2s;
    }
    td[contenteditable="true"]:focus{
      background:#fffde7;
      box-shadow:inset 0 0 0 2px #fbc02d;
    }

    /* Mobile labels */
    @media (max-width:720px){
      thead{display:none}
      table, tbody, tr, td{display:block; width:100%}
      tbody tr{margin:10px 12px; border:1px solid #e5eaf0; border-radius:10px; overflow:hidden}
      tbody td{border:none; border-top:1px solid #eef2f6}
      tbody td:first-child{border-top:none}
      tbody td::before{
        content:attr(data-label); 
        display:block; 
        font-size:.8rem; 
        text-transform:uppercase; 
        color:#576072; 
        margin-bottom:4px; 
        font-weight:800
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="banner">
      <div style="font-size:1.7rem">PROMOTION CADRE & MR-I & II</div>
      <small> FOR TRG YR : 2025 TO 2026</small>
    </div>

    <div class="section-title">Summary of Promotion Cadre</div>
    <div class="card">
      <table aria-label="Summary of Promotion Cadre">
        <colgroup>
          <col class="cadre">
          <col class="attend">
          <col class="pass">
          <col class="fail">
        </colgroup>
        <thead>
          <tr>
            <th rowspan="2" style="text-align:left">Cadre</th>
            <th rowspan="2">Attended</th>
            <th class="group" colspan="2">Result</th>
          </tr>
          <tr>
            <th>Pass</th>
            <th>Fail</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td data-label="Cadre" contenteditable="true">HAV TO NB SUB</td>
            <td data-label="Attended" contenteditable="true">40</td>
            <td data-label="Pass" contenteditable="true">20</td>
            <td data-label="Fail" contenteditable="true">20</td>
          </tr>
          <tr class="highlight">
            <td data-label="Cadre" contenteditable="true">NK TO HAV</td>
            <td data-label="Attended" contenteditable="true">60</td>
            <td data-label="Pass" contenteditable="true">58</td>
            <td data-label="Fail" contenteditable="true">02</td>
          </tr>
          <tr>
            <td data-label="Cadre" contenteditable="true">SEP TO NK</td>
            <td data-label="Attended" contenteditable="true">48</td>
            <td data-label="Pass" contenteditable="true">48</td>
            <td data-label="Fail" contenteditable="true">48</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="section-title">Summary of MR-I &amp; MR-II</div>
    <div class="card">
      <table aria-label="Summary of MR-I &amp; MR-II">
        <colgroup>
          <col>
          <col class="attend">
          <col class="pass">
          <col class="fail">
        </colgroup>
        <thead>
          <tr>
            <th rowspan="2" style="text-align:left">MR</th>
            <th rowspan="2">Attended</th>
            <th class="group" colspan="2">Result</th>
          </tr>
          <tr>
            <th>Pass</th>
            <th>Fail</th>
          </tr>
        </thead>
        <tbody>
          <tr class="highlight">
            <td data-label="MR" contenteditable="true">MR-II</td>
            <td data-label="Attended" contenteditable="true">35</td>
            <td data-label="Pass" contenteditable="true">35</td>
            <td data-label="Fail" contenteditable="true">-</td>
          </tr>
          <tr>
            <td data-label="MR" contenteditable="true">MR-I</td>
            <td data-label="Attended" contenteditable="true">40</td>
            <td data-label="Pass" contenteditable="true">40</td>
            <td data-label="Fail" contenteditable="true">-</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Save edited content to LocalStorage
    const tableCells = document.querySelectorAll("td[contenteditable='true']");

    tableCells.forEach((cell, index) => {
      // Restore saved value on page load
      const saved = localStorage.getItem("cell_" + index);
      if (saved !== null) {
        cell.textContent = saved;
      }

      // Save new value when user edits
      cell.addEventListener("input", () => {
        localStorage.setItem("cell_" + index, cell.textContent);
      });
    });
  </script>
</body>
</html>
