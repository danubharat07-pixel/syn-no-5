<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dynamic TRG Calendar – Solid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Attractive solid-friendly fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Theme tokens */
      :root {
        --text: #1f2430;
        --muted: #f14ec0;
        --heading: #1f2a44;
        --surface: #ffffff;
        --surface-2: #eef1f7;
        --border: #d8dbe6;
        --shadow: 0 8px 24px rgba(31, 42, 68, 0.08);
        --hover: #e8f0ff;
        --focus: 2px solid #2563eb;

        /* Event colors */
        --event-0: #2563eb;
        --event-1: #16a34a;
        --event-2: #7c3aed;
        --event-3: #ea580c;
        --event-4: #ca8a04;
        --event-5: #0ea5e9;
        --event-6: #be185d;
      }

      /* Base */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 80%;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        color: var(--text);
        padding: 32px 16px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        font-family: "Poppins", system-ui, sans-serif;
        color: var(--heading);
        margin: 0 0 20px;
        font-weight: 700;
        letter-spacing: 0.2px;
        animation: fadeInDown 0.6s ease-out;
      }

      /* Calendar shell */
      .calendar {
        width: 100%;
        height: 140%;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 16px;
        background: var(--surface);
        border: 2px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        box-shadow: var(--shadow);
        animation: fadeInUp 0.6s ease-out;
      }

      /* Day names */
      .day-name {
        text-align: center;
        font-weight: 800;
        color: white;
        background: var(--event-5);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 10px 6px;
        text-transform: uppercase;
        font-size: 1rem;
        letter-spacing: 1px;
        padding: 10px;
      }
      .day-name:nth-child(odd) {
        background: #f14ec0;
        color: white;
      }

      /* Day cells */
      .day {
        position: relative;
        background: #f9f45f;
        border: 1px solid var(--border);
        border-radius: 12px;
        text-align: center;
        min-height: 84px;
        padding: 12px 10px;
        cursor: pointer;
        transition: background 0.2s, transform 0.08s, box-shadow 0.2s,
          border-color 0.2s;
      }
      .day:nth-child(odd) {
        background: #64e644;
      }
      .day:hover {
        background: var(--hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(31, 42, 68, 0.08);
        z-index: 1;
      }
      .day .date {
        font-weight: 800;
        font-size: 1.05rem;
        color: var(--heading);
      }

      /* Event chip */
      .event {
        position: relative;
        margin-top: 8px;
        background: var(--event-0);
        color: #fff;
        padding: 8px 28px 8px 10px; /* room for delete */
        border-radius: 10px;
        font-size: 0.86rem;
        line-height: 1.2;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(0, 0, 0, 0.05);
        animation: popIn 0.25s ease;
        font-weight: 600;
      }
      .day[data-variant="1"] .event {
        background: var(--event-1);
      }
      .day[data-variant="2"] .event {
        background: var(--event-2);
      }
      .day[data-variant="3"] .event {
        background: var(--event-3);
      }
      .day[data-variant="4"] .event {
        background: var(--event-4);
      }
      .day[data-variant="5"] .event {
        background: var(--event-5);
      }
      .day[data-variant="6"] .event {
        background: var(--event-6);
      }

      /* Delete button */
      .delete-event {
        position: absolute;
        top: 4px;
        right: 6px;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.8rem;
        cursor: pointer;
      }

      /* Animations */
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .day:focus-visible {
        outline: var(--focus);
        outline-offset: 2px;
      }

      @media (max-width: 720px) {
        .calendar {
          gap: 8px;
          padding: 12px;
        }
        .day {
          min-height: 72px;
          padding: 10px 8px;
        }
        .event {
          font-size: 0.8rem;
          padding: 6px 24px 6px 8px;
        }
        .delete-event {
          top: 2px;
          right: 4px;
          font-size: 0.7rem;
        }
      }
      #calendarTitle {
        font-weight: bold;
        font-family: "Times New Roman", Times, serif;
        text-decoration: underline;
        text-transform: uppercase;
      }
    </style>
  </head>

  <body>
    <div
      style="
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-bottom: 20px;
      "
    >
      <button onclick="prevMonth()" style="font-size: 20px">
        ← Previous Month
      </button>
      <h1 id="calendarTitle"><u>Training Calendar</u></h1>
      <button onclick="nextMonth()" style="font-size: 20px">
        Next Month →
      </button>
    </div>

    <div class="calendar" id="calendar">
      <div class="day-name">Sunday</div>
      <div class="day-name">Monday</div>
      <div class="day-name">Tuesday</div>
      <div class="day-name">Wednesday</div>
      <div class="day-name">Thursday</div>
      <div class="day-name">Friday</div>
      <div class="day-name">Saturday</div>
    </div>

    <script>
      let MONTH = 7,
        YEAR = 2025;
      const INITIAL = { month: MONTH, year: YEAR };
      const DEFAULT_EVENTS = {
        1: "Fitness Test",
        5: "Weapon Inspection",
        7: "Weapons Training",
        11: "Drill Practice",
        14: "Map Reading",
        15: "Independence Parade",
        18: "Night Nav",
        23: "Mock Drill",
        27: "Range Practice",
        30: "Route March",
      };
      const monthNames = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];
      const calendar = document.getElementById("calendar");
      const titleEl = document.getElementById("calendarTitle");

      function generateCalendar(month, year) {
        const key = `calendarEvents_${month}_${year}`;
        const stored = JSON.parse(localStorage.getItem(key)) || {};
        const events = {
          ...(month === INITIAL.month && year === INITIAL.year
            ? DEFAULT_EVENTS
            : {}),
          ...stored,
        };

        titleEl.textContent = `${monthNames[month]} ${year} - TRG Calendar`;
        document.querySelectorAll(".day").forEach((d) => d.remove());
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // blank slots
        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement("div");
          empty.classList.add("day");
          calendar.appendChild(empty);
        }

        // days
        for (let day = 1; day <= daysInMonth; day++) {
          const cell = document.createElement("div");
          cell.classList.add("day");
          cell.dataset.variant = new Date(year, month, day).getDay();

          const lbl = document.createElement("div");
          lbl.classList.add("date");
          lbl.textContent = day;
          cell.appendChild(lbl);

          // render existing event
          if (events[day]) {
            appendEventChip(cell, day, events, key, month, year);
          }

          // click date to add/edit
          cell.addEventListener("click", () => {
            const role = localStorage.getItem("role");
            if (role !== "TrgJCO") {
              return;
            }
            const current = events[day] || "";
            const txt = prompt(
              `Event for ${monthNames[month]} ${day}:`,
              current
            );
            if (txt === null) return; // cancelled
            if (txt.trim() === "") {
              // remove
              delete events[day];
              localStorage.setItem(key, JSON.stringify(events));
              const old = cell.querySelector(".event");
              if (old) {
                old.remove();
              }
            } else {
              // add/update
              events[day] = txt;
              localStorage.setItem(key, JSON.stringify(events));
              // remove old and re-append chip (with delete btn)
              const old = cell.querySelector(".event");
              if (old) {
                old.remove();
              }
              appendEventChip(cell, day, events, key, month, year);
            }
          });

          calendar.appendChild(cell);
        }
      }

      // helper to build event + delete button
      function appendEventChip(cell, day, events, storageKey, month, year) {
        const ev = document.createElement("div");
        ev.classList.add("event");
        ev.textContent = events[day];

        const role = localStorage.getItem("role");
        if (role === "TrgJCO") {
          const btn = document.createElement("button");
          btn.classList.add("delete-event");
          btn.textContent = "✕";
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (!confirm(`Remove event on ${monthNames[month]} ${day}?`))
              return;
            delete events[day];
            localStorage.setItem(storageKey, JSON.stringify(events));
            ev.remove();
          });

          ev.appendChild(btn);
        }
        cell.appendChild(ev);
      }

      // init & navigation
      generateCalendar(MONTH, YEAR);
      function prevMonth() {
        MONTH--;
        if (MONTH < 0) {
          MONTH = 11;
          YEAR--;
        }
        generateCalendar(MONTH, YEAR);
      }
      function nextMonth() {
        MONTH++;
        if (MONTH > 11) {
          MONTH = 0;
          YEAR++;
        }
        generateCalendar(MONTH, YEAR);
      }
    </script>
  </body>
</html>
