<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Social Calendar</title>
  <link rel="stylesheet" href="socialcalendar.css" />
  <style>
    /* Highlight edit mode */
    .editable {
      outline: 2px dashed #ccc;
      background-color: #fefefe;
    }

    /* Control bar */
    #edit-controls {
      text-align: center;
      margin: 20px 0;
    }
    #edit-controls button {
      margin: 0 8px;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: #81c784;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }
    #edit-controls button.cancel {
      background: #e57373;
    }

    /* Add Event form */
    #add-form {
      display: none;
      max-width: 400px;
      margin: 0 auto 20px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
    }
    #add-form input {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #add-form button {
      margin: 6px 8px 0 0;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: #42a5f5;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }
    #add-form button.cancel {
      background: #e57373;
    }
  </style>
</head>
<body>

  <div id="edit-controls">
    <button id="enable-edit">Enable Edit</button>
    <button id="save-changes" style="display:none;">Save Changes</button>
    <button id="reset-default">Reset to Default</button>
    <button id="add-event">Add Event</button>
  </div>

  <!-- Add Event Form -->
  <div id="add-form">
    <input id="new-title"      type="text" placeholder="Event Title" />
    <input id="new-datetime"   type="text" placeholder="Date, Time" />
    <input id="new-location"   type="text" placeholder="Location" />
    <button id="add-submit">Add</button>
    <button id="add-cancel" class="cancel">Cancel</button>
  </div>

  <div class="calendar-container">
    <h1>🌼 <u>SOCIAL CALENDAR</u></h1>
    <div class="calendar-grid"></div>
  </div>

  <script>
    // --------- CONFIG ----------
    const ADMIN_PASSWORD = '8kumaon#65';   // ← Change this to your desired admin pass
    const STORAGE_KEY    = 'socialCalendarEvents';
    const COLORS = ['pink','lavender','mint','peach','sky'];

    // --------- DEFAULT EVENTS ----------
    const defaultEvents = [
      { title: 'CONGO DAY CELEBRATION',                 datetime: 'Sunday, Sept 7 · 10:00 AM',   location: 'PT GROUND' },
      { title: 'VETERANS DAY',                          datetime: 'Wednesday, Sept 10 · 6:30 AM',location: 'PINEWOOD RESTRO -BAR' },
      { title: 'VAN MAHOTSAV (EK PED MAA KE NAAM)',      datetime: 'Friday, Sept 12 · 4:00 PM',   location: 'BN AOR' },
      { title: 'SADBHAVNA (FOOTBALL)',                  datetime: 'Saturday, Sept 13 · 3:40 PM', location: 'GOVT. SCHOOL , RHENOCK' },
      { title: 'OPEN BAR',                              datetime: 'Tuesday, Sept 16 · 2:00 PM',  location: 'PT GROUND' },
      { title: 'SUMMER ADVENTURE CAMP OPENING ADDRESS', datetime: 'Monday, Sept 22 · 9:00 AM',   location: 'CONFERENCE HALL' },
      { title: 'DIAMOND JUBILEE',                       datetime: 'Monday, Aug 30 · 7:00 PM',    location: 'BN PT GROUND' },
      { title: 'YOGA DAY',                              datetime: 'Monday, Sept 29 · 8:00 AM',   location: 'PT GROUND' },
      { title: 'SUMMER ADVENTURE CAMP CLOSING ADDRESS', datetime: 'Saturday, Oct 11 · 10:00 AM', location: 'CONFERENCE HALL' }
    ];

    // --------- STATE HELPERS ----------
    function loadEvents() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [...defaultEvents];
    }
    function saveEvents(arr) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    }
    function promptPassword() {
      const attempt = prompt('Enter admin password:');
      if (attempt !== ADMIN_PASSWORD) {
        alert('Invalid password. Action cancelled.');
        return false;
      }
      return true;
    }
    function resetToDefaultData() {
      localStorage.removeItem(STORAGE_KEY);
      renderEvents();
      disableEditMode();
    }

    // --------- RENDERING ----------
    function getColor(idx) {
      return COLORS[idx % COLORS.length];
    }
    function renderEvents() {
      const grid   = document.querySelector('.calendar-grid');
      const events = loadEvents();
      grid.innerHTML = '';   // clear old

      events.forEach((ev, idx) => {
        const card = document.createElement('div');
        card.className = `event-card ${getColor(idx)}`;
        
        const h2 = document.createElement('h2');
        h2.textContent = ev.title;
        const p1 = document.createElement('p');
        p1.textContent = ev.datetime;
        const p2 = document.createElement('p');
        p2.textContent = ev.location;

        // if we’re in edit-mode, make these editable
        if (document.getElementById('save-changes').style.display === 'inline-block') {
          card.classList.add('editable');
          [h2, p1, p2].forEach(el => el.setAttribute('contenteditable','true'));
        }

        card.append(h2, p1, p2);
        grid.appendChild(card);
      });
    }

    // --------- EDIT MODE ----------
    function enableEditMode() {
      if (!promptPassword()) return;
      document.getElementById('enable-edit').style.display = 'none';
      document.getElementById('save-changes').style.display = 'inline-block';
      document.querySelectorAll('.event-card').forEach(card => {
        card.classList.add('editable');
        card.querySelectorAll('h2, p').forEach(el =>
          el.setAttribute('contenteditable','true')
        );
      });
    }
    function disableEditMode() {
      document.getElementById('enable-edit').style.display = 'inline-block';
      document.getElementById('save-changes').style.display = 'none';
      document.querySelectorAll('.event-card').forEach(card => {
        card.classList.remove('editable');
        card.querySelectorAll('h2, p').forEach(el =>
          el.removeAttribute('contenteditable')
        );
      });
    }
    function saveChanges() {
      if (!promptPassword()) return;
      const updated = [];
      document.querySelectorAll('.event-card').forEach(card => {
        const [h2, p1, p2] = card.querySelectorAll('h2, p');
        updated.push({
          title:    h2.textContent.trim(),
          datetime: p1.textContent.trim(),
          location: p2.textContent.trim()
        });
      });
      saveEvents(updated);
      disableEditMode();
      renderEvents();
    }

    // --------- ADD EVENT ----------
    function showAddForm() {
      if (!promptPassword()) return;
      document.getElementById('add-form').style.display = 'block';
    }
    function hideAddForm() {
      document.getElementById('add-form').style.display = 'none';
      document.getElementById('new-title').value = '';
      document.getElementById('new-datetime').value = '';
      document.getElementById('new-location').value = '';
    }
    function addEvent() {
      const title    = document.getElementById('new-title').value.trim();
      const datetime = document.getElementById('new-datetime').value.trim();
      const location = document.getElementById('new-location').value.trim();

      if (!title || !datetime || !location) {
        alert('Please fill in all fields.');
        return;
      }

      const events = loadEvents();
      events.push({ title, datetime, location });
      saveEvents(events);

      hideAddForm();
      renderEvents();
    }

    // --------- HOOKS ----------
    document.getElementById('enable-edit').addEventListener('click', enableEditMode);
    document.getElementById('save-changes').addEventListener('click', saveChanges);
    document.getElementById('reset-default').addEventListener('click', resetToDefaultData);
    document.getElementById('add-event').addEventListener('click', showAddForm);
    document.getElementById('add-cancel').addEventListener('click', hideAddForm);
    document.getElementById('add-submit').addEventListener('click', addEvent);

    // initial render
    document.addEventListener('DOMContentLoaded', renderEvents);
  </script>
</body>
</html>
