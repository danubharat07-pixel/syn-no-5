    <!-- Main Container -->

      <!-- Left Box with Slideshow -->
      <div class="box left">

          <source src="/images/imgSlider/Drone.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>     
        <!-- Video too be added later -->
      </div>

      <!-- Right Box -->
      <div class="box right">
        <h2>Our Arsenal</h2>
        <p>
          Explore our advanced  drones systems designed
          for modern warfare.
        </p>
        <!-- Slider Start -->
  <div class="slider">
    <div class="slides">
      <img src="/summarypage/DRONE.jpg" alt="Drone 1">
      <img src="/summarypage/DRONE3.jpg" alt="Drone 2">
      <img src="/summarypage/DRONES 2.jpg" alt="Drone 3">

      <img src="/summarypage/DRONE.jpg" alt="Drone 1">
      <img src="/summarypage/DRONE3.jpg" alt="Drone 2">
      <img src="/summarypage/DRONES 2.jpg" alt="Drone 3">
      <img src="/summarypage/DRONE.jpg" alt="Drone 1">
      <img src="/summarypage/DRONE3.jpg" alt="Drone 2">
      <img src="/summarypage/DRONES 2.jpg" alt="Drone 3">
    </div>
    <button class="nav prev">&#10094;</button>
    <button class="nav next">&#10095;</button>
  </div>
  <!-- Slider End -->
      </div>
    </div>

    <!-- Footer Navigation -->
    <footer>
      <nav>
        <ul>
          <li><a href="/study-material/precis/black-hornet-prs-brochure-web.PDF">User Manual</a></li>
          <li><a href="/images/homepage/manu.jpeg">Advisory for Drones</a></li>
          <li><a href="images/homepage/Screenshot 2025-08-25 013711.png">Specifications</a></li>
        </ul>
      </nav>
    </footer>
    <script>
  (function(){
    const slidesEl = document.querySelector('.slider .slides');
    const imgs      = slidesEl.querySelectorAll('img').length;
    let   idx       = 0;

    document.querySelector('.slider .next')
      .addEventListener('click', ()=> {
        idx = (idx + 1) % imgs;
        slidesEl.style.transform = `translateX(-${idx * 100}%)`;
      });

    document.querySelector('.slider .prev')
      .addEventListener('click', ()=> {
        idx = (idx - 1 + imgs) % imgs;
        slidesEl.style.transform = `translateX(-${idx * 100}%)`;
      });
  })();
</script>
  </body>
</html>
